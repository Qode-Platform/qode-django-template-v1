# fleet.conf - app manifest. Sourced (as shell) by the lifecycle scripts
# (bin/run bin/start bin/restart bin/reload bin/stop). $PORT and $BASE_PATH are
# available inside every command. An empty command skips that step.

NAME="Django Template"
PORT="8000"
# Relative to the app root: the fleet prefixes $BASE_PATH itself.
HEALTH_PATH="/"

INSTALL_CMD='python3 -m venv .venv && .venv/bin/pip install --upgrade pip -r requirements.txt'
BUILD_CMD='.venv/bin/python manage.py migrate --noinput'
START_CMD='.venv/bin/gunicorn config.wsgi:application --bind 0.0.0.0:$PORT'
RELOAD_CMD=''

# The app serves every route under $BASE_PATH (the ingress forwards the
# prefix unchanged). Empty/unset => it serves at the host root.
